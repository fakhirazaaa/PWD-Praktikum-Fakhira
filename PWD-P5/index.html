<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PinkMart</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <header>
        <h1>PinkMart</h1>
        <button id="cart-toggle">
            Keranjang (<span id="cart-count">0</span>)
        </button>
    </header>

    <section class="banner">
        <h2>Welcome to PinkMart</h2>
        <p>Temukan produk favoritmu dengan harga terbaik.</p>
    </section>

    <main class="container">

        <div class="judul">
            <h2>Daftar Produk</h2>
            <input type="text" id="search" placeholder="Cari produk...">
        </div>

        <div class="products" id="product-list"></div>

        <section class="cart" id="cart-panel">
            <h2>Keranjang Belanja</h2>

            <div id="cart-list">
                <p>Keranjang masih kosong.</p>
            </div>

            <div class="total">
                <p>Jumlah Item: <span id="total-items">0</span></p>
                <h3>Total Harga: Rp <span id="total-price">0</span></h3>
            </div>

            <div class="buttons">
                <button id="clear-cart">Kosongkan Keranjang</button>
                <button id="checkout">Checkout</button>
            </div>

            <div id="checkout-result"></div>
        </section>

    </main>

    <footer>
        <p>PinkMart © 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
